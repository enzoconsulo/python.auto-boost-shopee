# Copie este arquivo para config.toml e preencha com suas credenciais reais.
# Nenhum valor abaixo é válido — são apenas exemplos de formato.

[shopee]
partner_id = 0
partner_key = "sua-partner-key"
shop_id = 0
access_token = "seu-access-token"
refresh_token = "seu-refresh-token"

[ciclo]
# a cada quantas horas o rodízio roda um ciclo de impulsionamento
intervalo_horas = 4
# quantos itens podem ser impulsionados simultaneamente por ciclo
limite_slots = 5
# caminho do endpoint de boost — ver _gestao/DECISOES.md ("Endpoint de boost da
# Shopee: incerteza registrada"); confirme com a documentação da sua conta antes de usar
endpoint_boost = "/api/v2/product/boost_item"

[caminhos]
log = "shopee-rodizio.log"
estado = "estado.json"

# Seção opcional — sem ela, chamadas à Shopee saem direto (sem proxy), como sempre.
# Descomente e aponte para o túnel SSH da VM de IP fixo se o whitelist da Shopee estiver
# quebrando por causa de IP dinâmico (ver README, "IP de saída fixo").
# [rede]
# proxy_https = "socks5h://127.0.0.1:1080"

# Um bloco [[itens]] por anúncio participante do rodízio. `peso` é relativo entre os
# itens: quanto maior, mais frequentemente o item é sorteado para impulsionar.
[[itens]]
id = 123456789
peso = 3

[[itens]]
id = 987654321
peso = 1
