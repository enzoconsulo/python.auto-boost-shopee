<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Rodízio Shopee</title>
<link rel="stylesheet" href="/painel.css">
</head>
<body>
<header class="topo">
  <div class="titulo">
    <h1>Rodízio Shopee</h1>
    <p id="resumo-ciclo" class="sutil">carregando…</p>
  </div>
  <div class="acoes-topo">
    <span id="catalogo-status" class="sutil"></span>
    <button id="btn-atualizar" type="button" class="secundario">Atualizar da Shopee</button>
  </div>
</header>

<nav class="abas" role="tablist">
  <button type="button" role="tab" class="aba" data-aba="pesos">Pesos</button>
  <button type="button" role="tab" class="aba" data-aba="agora">No ar agora</button>
  <button type="button" role="tab" class="aba" data-aba="relatorio">Relatório</button>
</nav>

<div id="aviso" class="aviso" hidden></div>

<div id="aba-pesos" class="painel-aba">
<section class="filtros">
  <input id="busca" type="search" placeholder="Buscar por nome ou ID" autocomplete="off">
  <label class="chk"><input id="so-rodizio" type="checkbox"> só os que estão no rodízio</label>
  <select id="ordem" aria-label="Ordenar por">
    <option value="peso">ordenar por peso</option>
    <option value="nome">ordenar por nome</option>
    <option value="estoque">ordenar por estoque</option>
    <option value="sucesso">ordenar por último boost</option>
  </select>
</section>

<main id="lista" class="lista" aria-live="polite"></main>
</div>

<div id="aba-agora" class="painel-aba" hidden>
  <section class="bloco">
    <h2 class="secao">Impulsionados agora</h2>
    <p id="agora-legenda" class="sutil"></p>
    <div id="agora-lista" class="lista-compacta"></div>
  </section>
  <section class="bloco">
    <h2 class="secao">Último ciclo</h2>
    <p id="ultimo-legenda" class="sutil"></p>
    <div id="ultimo-lista" class="lista-compacta"></div>
  </section>
</div>

<div id="aba-relatorio" class="painel-aba" hidden>
  <section class="bloco">
    <div class="linha-titulo">
      <h2 class="secao">Resumo</h2>
      <select id="dias" aria-label="Período">
        <option value="1">últimas 24 horas</option>
        <option value="7" selected>últimos 7 dias</option>
        <option value="30">últimos 30 dias</option>
        <option value="90">últimos 90 dias</option>
      </select>
    </div>
    <div id="rel-resumo" class="numeros"></div>
  </section>
  <section class="bloco">
    <h2 class="secao">Boosts por dia</h2>
    <div id="rel-dias" class="barras"></div>
  </section>
  <section class="bloco">
    <h2 class="secao">Por item</h2>
    <p class="sutil">Parte dos boosts que o item recebeu × parte do peso que ele tem hoje.</p>
    <div class="tabela-rolagem"><table id="rel-itens" class="tabela"></table></div>
  </section>
  <section class="bloco">
    <h2 class="secao">Falhas mais frequentes</h2>
    <div id="rel-erros"></div>
  </section>
</div>

<footer id="barra-salvar" class="barra-salvar" hidden>
  <span id="pendentes"></span>
  <div>
    <button id="btn-descartar" type="button" class="secundario">Descartar</button>
    <button id="btn-salvar" type="button">Salvar</button>
  </div>
</footer>

<template id="tpl-item">
  <article class="item">
    <img class="foto" alt="" loading="lazy" referrerpolicy="no-referrer">
    <div class="info">
      <h2 class="nome"></h2>
      <p class="meta sutil"></p>
      <p class="hist sutil"></p>
    </div>
    <div class="controle">
      <label class="chk"><input class="no-rodizio" type="checkbox"> no rodízio</label>
      <div class="peso-linha">
        <input class="peso-slider" type="range" min="1" max="100" step="1" aria-label="peso">
        <input class="peso-num" type="number" min="1" max="1000" step="1" aria-label="peso">
      </div>
      <p class="chance sutil"></p>
    </div>
  </article>
</template>

<script src="/painel.js"></script>
</body>
</html>
